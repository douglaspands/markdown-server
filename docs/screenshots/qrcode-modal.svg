<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Dimmed Background Overlay -->
  <rect x="0" y="0" width="600" height="450" fill="#000000" fill-opacity="0.6"/>

  <!-- Modal Card -->
  <rect x="110" y="45" width="380" height="360" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#modalShadow)"/>

  <!-- Modal Header -->
  <text x="140" y="80" fill="#e6edf3" font-size="16" font-weight="600">Acessar no Celular / Tablet</text>
  <text x="455" y="80" fill="#8b949e" font-size="18" font-weight="600" cursor="pointer">✕</text>
  <line x1="110" y1="95" x2="490" y2="95" stroke="#30363d" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="300" y="120" fill="#8b949e" font-size="12" text-anchor="middle">Escaneie o QR Code na mesma rede Wi-Fi (LAN):</text>

  <!-- QR Code White Box -->
  <rect x="220" y="135" width="160" height="160" rx="8" fill="#ffffff"/>
  
  <!-- Stylized QR Code Pixels -->
  <g transform="translate(235, 150)" fill="#111827">
    <!-- Top Left Finder Pattern -->
    <rect x="0" y="0" width="36" height="36" rx="4"/>
    <rect x="6" y="6" width="24" height="24" fill="#ffffff"/>
    <rect x="12" y="12" width="12" height="12"/>

    <!-- Top Right Finder Pattern -->
    <rect x="94" y="0" width="36" height="36" rx="4"/>
    <rect x="100" y="6" width="24" height="24" fill="#ffffff"/>
    <rect x="106" y="12" width="12" height="12"/>

    <!-- Bottom Left Finder Pattern -->
    <rect x="0" y="94" width="36" height="36" rx="4"/>
    <rect x="6" y="100" width="24" height="24" fill="#ffffff"/>
    <rect x="12" y="106" width="12" height="12"/>

    <!-- Data dots -->
    <rect x="44" y="10" width="8" height="8"/>
    <rect x="60" y="10" width="8" height="8"/>
    <rect x="76" y="10" width="8" height="8"/>
    <rect x="44" y="26" width="8" height="8"/>
    <rect x="76" y="26" width="8" height="8"/>
    
    <rect x="10" y="44" width="8" height="8"/>
    <rect x="26" y="44" width="8" height="8"/>
    <rect x="44" y="44" width="16" height="8"/>
    <rect x="70" y="44" width="8" height="8"/>
    <rect x="94" y="44" width="8" height="8"/>
    <rect x="110" y="44" width="8" height="8"/>

    <rect x="10" y="60" width="8" height="8"/>
    <rect x="44" y="60" width="8" height="8"/>
    <rect x="60" y="60" width="16" height="8"/>
    <rect x="94" y="60" width="16" height="8"/>

    <rect x="44" y="76" width="8" height="8"/>
    <rect x="60" y="76" width="8" height="8"/>
    <rect x="76" y="76" width="16" height="8"/>
    <rect x="110" y="76" width="8" height="8"/>

    <rect x="44" y="94" width="16" height="8"/>
    <rect x="70" y="94" width="8" height="8"/>
    <rect x="94" y="94" width="8" height="8"/>
    <rect x="44" y="110" width="8" height="8"/>
    <rect x="60" y="110" width="16" height="8"/>
    <rect x="94" y="110" width="16" height="8"/>
  </g>

  <!-- URL Input and Copy Button -->
  <g transform="translate(135, 315)">
    <rect x="0" y="0" width="240" height="34" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="12" y="22" fill="#58a6ff" font-size="12" font-family="monospace">http://192.168.1.105:8080</text>

    <rect x="248" y="0" width="82" height="34" rx="6" fill="#238636" stroke="#2ea043" stroke-width="1"/>
    <text x="268" y="22" fill="#ffffff" font-size="12" font-weight="600">Copiar</text>
  </g>

  <!-- IP Network Badge -->
  <g transform="translate(300, 375)">
    <rect x="-80" y="0" width="160" height="20" rx="10" fill="#1f6feb" fill-opacity="0.15"/>
    <text x="0" y="14" fill="#58a6ff" font-size="10" font-weight="500" text-anchor="middle">📡 IP de Rede Local Detectado</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="15" y="15" width="720" height="390" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#boxShadow)"/>

  <text x="35" y="45" fill="#e6edf3" font-size="16" font-weight="700">📌 GitHub Alerts &amp; Recursos Avançados de Renderização</text>
  <line x1="35" y1="58" x2="715" y2="58" stroke="#30363d" stroke-width="1"/>

  <!-- Note -->
  <g transform="translate(35, 70)">
    <rect x="0" y="0" width="680" height="45" rx="4" fill="#2f81f7" fill-opacity="0.08" stroke="#2f81f7" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="45" fill="#2f81f7"/>
    <text x="15" y="18" fill="#2f81f7" font-size="11" font-weight="600">ℹ️ Note</text>
    <text x="15" y="34" fill="#e6edf3" font-size="11">Destaque informações úteis que os usuários devem saber enquanto navegam.</text>
  </g>

  <!-- Tip -->
  <g transform="translate(35, 125)">
    <rect x="0" y="0" width="680" height="45" rx="4" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="45" fill="#3fb950"/>
    <text x="15" y="18" fill="#3fb950" font-size="11" font-weight="600">💡 Tip</text>
    <text x="15" y="34" fill="#e6edf3" font-size="11">Sugestões e atalhos úteis para maior produtividade no desenvolvimento.</text>
  </g>

  <!-- Important -->
  <g transform="translate(35, 180)">
    <rect x="0" y="0" width="680" height="45" rx="4" fill="#a371f7" fill-opacity="0.08" stroke="#a371f7" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="45" fill="#a371f7"/>
    <text x="15" y="18" fill="#a371f7" font-size="11" font-weight="600">📑 Important</text>
    <text x="15" y="34" fill="#e6edf3" font-size="11">Informações cruciais necessárias para o sucesso da configuração do sistema.</text>
  </g>

  <!-- Warning -->
  <g transform="translate(35, 235)">
    <rect x="0" y="0" width="680" height="45" rx="4" fill="#d29922" fill-opacity="0.08" stroke="#d29922" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="45" fill="#d29922"/>
    <text x="15" y="18" fill="#d29922" font-size="11" font-weight="600">⚠️ Warning</text>
    <text x="15" y="34" fill="#e6edf3" font-size="11">Pontos de atenção crítica que exigem ação imediata para evitar falhas.</text>
  </g>

  <!-- Caution -->
  <g transform="translate(35, 290)">
    <rect x="0" y="0" width="680" height="45" rx="4" fill="#f85149" fill-opacity="0.08" stroke="#f85149" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="45" fill="#f85149"/>
    <text x="15" y="18" fill="#f85149" font-size="11" font-weight="600">🛑 Caution</text>
    <text x="15" y="34" fill="#e6edf3" font-size="11">Consequências potencialmente destrutivas de uma ação ou comando.</text>
  </g>

  <!-- Footnotes & Math footer preview -->
  <g transform="translate(35, 355)">
    <rect x="0" y="0" width="680" height="35" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="15" y="22" fill="#8b949e" font-size="11">Fórmula Matemática: <tspan fill="#58a6ff" font-family="serif">f(x) = ∫₀^∞ e^(-x²) dx</tspan> | Listas: <tspan fill="#e6edf3">&lt;dl&gt;&lt;dt&gt;&lt;dd&gt;</tspan> | Copiar Código: <tspan fill="#3fb950">[✓ Ativo]</tspan></text>
  </g>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality Gate & Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Instalar Dependências
        run: go mod download

      - name: Verificação de Formatação (gofmt)
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Arquivos Go não formatados encontrados:"
            gofmt -s -l .
            exit 1
          fi

      - name: Executar Testes com Barreira de Cobertura >= 80%
        run: bash scripts/coverage.sh

      - name: Upload Relatório de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 14
